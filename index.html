<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Cute Love Letter 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:420px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    position:relative;
}

h1{
    color:#ff4081;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:18px;
    margin-bottom:30px;
}

.buttons{
    position:relative;
    height:120px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

#yes{
    background:#ff4081;
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#666;
    color:white;
    position:absolute;
    left:230px;
}

#message{
    margin-top:20px;
    font-size:22px;
    color:#ff4081;
    display:none;
}
</style>

</head>
<body>

<div class="card">

<h1>💌 A Love Letter 💌</h1>
<h1> For My Love 💕</h1>

<p>
You make every day brighter. 🌸<br><br>
Will you always stay with me? ❤️<br></br>
Will you be my wife? 💍
</p>

<div class="buttons">

<button id="yes">💖 Yes</button>

<button id="no">🙈 No</button>

</div>

<h1> Yours, Haseeb ✨ </h1>

<div id="message">
🥰 Yaaay!! You're My Wife Now. 😊 ❤️🌹
</div>

</div>

<script>

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const msg=document.getElementById("message");

function moveButton(){

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-60);

noBtn.style.position="fixed";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

yesBtn.onclick=function(){

msg.style.display="block";

document.querySelector(".buttons").style.display="none";

}

</script>

</body>
</html>
